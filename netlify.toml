[build]
  command = "git fetch --unshallow || true && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/wiki/special/categories"
  to = "/wiki/Special/Categories"
  status = 301
  force = true

[[redirects]]
  from = "/wiki/special/categories/"
  to = "/wiki/Special/Categories/"
  status = 301
  force = true

[[redirects]]
  from = "/wiki/special/allpages"
  to = "/wiki/Special/AllPages"
  status = 301
  force = true

[[redirects]]
  from = "/wiki/special/allpages/"
  to = "/wiki/Special/AllPages/"
  status = 301
  force = true

[[redirects]]
  from = "/wiki/*"
  to = "/wiki/:splat"
  status = 200

[[redirects]]
  from = "/api/warm"
  to = "/.netlify/functions/warm"
  status = 200

[build.environment]
  NODE_VERSION = "22"
  TAOPEDIA_ARTICLES_REF = "main"

[context.branch-deploy.environment]
  TAOPEDIA_ARTICLES_REF = "test"

[context.deploy-preview.environment]
  TAOPEDIA_ARTICLES_REF = "test"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' https: data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
