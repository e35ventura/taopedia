[build]
  command = "git fetch --unshallow || true && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/wiki/*"
  to = "/wiki/:splat"
  status = 200

[[redirects]]
  from = "/api/warm"
  to = "/.netlify/functions/warm"
  status = 200

[build.environment]
  NODE_VERSION = "20"
