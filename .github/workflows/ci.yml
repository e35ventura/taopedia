name: CI

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:build
