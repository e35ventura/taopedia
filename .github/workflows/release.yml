name: Release test to main

on:
  schedule:
    # 15:00 UTC is 9 AM Central Standard Time and 10 AM Central Daylight Time.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would happen without pushing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: test

      - name: Verify main is ancestor of test
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin test:refs/remotes/origin/test
          if ! git merge-base --is-ancestor origin/main origin/test; then
            echo "::error::main is not an ancestor of test. Rebase or merge main into test before promoting."
            exit 1
          fi
          ahead=$(git rev-list --count origin/main..origin/test)
          echo "main is behind test by $ahead commit(s)."
          echo "AHEAD=$ahead" >> "$GITHUB_ENV"
          echo "TEST_SHA=$(git rev-parse origin/test)" >> "$GITHUB_ENV"

      - name: No changes to promote
        if: ${{ env.AHEAD == '0' }}
        run: echo "::notice::main already matches test. Nothing to promote."

      - name: Setup Node
        if: ${{ env.AHEAD != '0' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ env.AHEAD != '0' }}
        run: npm ci

      - name: Build production site
        if: ${{ env.AHEAD != '0' }}
        run: npm run build

      - name: Promote test to main
        if: ${{ env.AHEAD != '0' && github.event.inputs.dry_run != 'true' }}
        run: |
          git push origin refs/remotes/origin/test:refs/heads/main
          echo "::notice::Promoted $AHEAD commit(s) from test to main at $TEST_SHA."

      - name: Dry run summary
        if: ${{ env.AHEAD != '0' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "DRY RUN: would fast-forward main to $TEST_SHA"
          git log --oneline origin/main..origin/test | head -50
